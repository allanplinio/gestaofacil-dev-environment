# ═══════════════════════════════════════════════════════════════════════════
#  Proxy reverso global — roteamento por nome de domínio
# ═══════════════════════════════════════════════════════════════════════════
#
#  gestaofacil.localhost       → Vite dev server (React)
#  api.gestaofacil.localhost   → gestaofacil-api  (PHP-FPM, raiz em /public)
#  nfe.gestaofacil.localhost   → nfe-api          (PHP-FPM, raiz em /public)
#
#  Este arquivo é incluído dentro do bloco http; server_tokens vale para todos os servers.
#  Não anuncia a versão do Nginx nos cabeçalhos de resposta.
server_tokens off;
#
#  Este arquivo é incluído no contexto http do Nginx (conf.d/*.conf),
#  por isso o `map` abaixo é válido aqui.
# ═══════════════════════════════════════════════════════════════════════════

# Necessário para o WebSocket do HMR do Vite: repassa o header Connection
# como "upgrade" apenas quando o cliente pediu upgrade.
# DNS embutido do Docker. Com ele + variavel no proxy_pass/fastcgi_pass, o
# Nginx resolve o upstream NA REQUISICAO, nao no boot. Sem isso o proxy se
# recusa a iniciar quando qualquer um dos apps esta parado — o que em
# ambiente de dev acontece toda hora (rebuild do front, container caido).
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Log em formato que mostra qual vhost atendeu — ajuda a depurar roteamento.
log_format vhost '$remote_addr - [$time_local] "$host" "$request" '
                 '$status $body_bytes_sent upstream=$upstream_addr';
access_log /var/log/nginx/access.log vhost;


# ───────────────────────────────────────────────────────────────────────────
#  Default server: responde a qualquer Host não reconhecido.
#  Sem isso o Nginx serviria o primeiro vhost por engano e você perderia
#  tempo achando que o roteamento funcionou.
# ───────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_name _;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        add_header Content-Type text/plain;
        return 404 "Host '$host' nao mapeado. Use gestaofacil.localhost, api.gestaofacil.localhost ou nfe.gestaofacil.localhost\n";
    }
}


# ───────────────────────────────────────────────────────────────────────────
#  FRONTEND — http://gestaofacil.localhost
# ───────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_name gestaofacil.localhost;

    location / {
        set $fe_upstream http://gestaofacil_fe:3000;
        proxy_pass $fe_upstream;
        proxy_http_version 1.1;

        # HMR do Vite trafega por WebSocket nesta mesma porta.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O dev server pode demorar no primeiro bundle.
        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
        proxy_buffering       off;
    }
}


# ───────────────────────────────────────────────────────────────────────────
#  API DE GESTÃO — http://api.gestaofacil.localhost
# ───────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_name api.gestaofacil.localhost api.gestaofacil.internal;

    # Mesmo caminho absoluto montado no container PHP (working_dir do
    # serviço gestaofacil_api). Se um dos dois mudar, o PHP-FPM devolve
    # "Primary script unknown".
    root  /var/www/gestaofacil-api/public;
    index index.php;

    client_max_body_size 8M;  # maior upload legítimo: 5 MB (certificado no nfe-api)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $gestaofacil_upstream gestaofacil_api:9000;
        fastcgi_pass $gestaofacil_upstream;
        include      fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Uploads e chamadas à SEFAZ podem passar dos 60s padrão.
        fastcgi_read_timeout 300s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;

        internal;
    }

    # Só index.php executa. Qualquer outro .php dentro de public/ é negado,
    # o que fecha a classe de ataque de PHP-FPM executar arquivo enviado.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}


# ───────────────────────────────────────────────────────────────────────────
#  API DE NFe — http://nfe.gestaofacil.localhost
# ───────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_name nfe.gestaofacil.localhost nfe.gestaofacil.internal;

    root  /var/www/nfe-api/public;
    index index.php;

    # XML de NFe e certificados A1 (.pfx) sobem por aqui.
    client_max_body_size 8M;  # maior upload legítimo: 5 MB (certificado no nfe-api)

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        set $nfe_upstream nfe_api:9000;
        fastcgi_pass $nfe_upstream;
        include      fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_read_timeout 300s;
        fastcgi_buffers      16 16k;
        fastcgi_buffer_size  32k;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
