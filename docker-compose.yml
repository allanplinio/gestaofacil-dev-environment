# ═══════════════════════════════════════════════════════════════════════════
#  GestãoFácil — Ambiente de Desenvolvimento Local (orquestrador único)
# ═══════════════════════════════════════════════════════════════════════════
#
#  Este arquivo substitui os quatro docker-compose.yml que existiam antes
#  (raiz, nfe-api/, gestaofacil-api/, gestaofacil-fe/). Rodar mais de um
#  deles ao mesmo tempo foi o que gerou dois bancos gestaofacil em portas
#  diferentes. Aqui existe UMA stack, UM proxy, UM Redis.
#
#  Convenções que valem para todos os serviços:
#    - o código de cada projeto é montado no MESMO caminho absoluto dentro
#      do container PHP e dentro do Nginx. Isso é obrigatório: o Nginx envia
#      SCRIPT_FILENAME para o PHP-FPM, e o PHP-FPM precisa achar o arquivo
#      naquele caminho exato.
#    - toda porta publicada no host é configurável por .env, porque a
#      máquina do dev pode já ter Postgres/Redis/Apache rodando.
#
#  Uso: make up   (ou: docker compose up -d)
# ═══════════════════════════════════════════════════════════════════════════

name: gestaofacil-dev

services:

  # ─────────────────────────────────────────────────────────────────────────
  #  PROXY REVERSO GLOBAL
  #  Única porta exposta ao navegador. Roteia por nome de domínio.
  # ─────────────────────────────────────────────────────────────────────────
  gestaofacil_nginx:
    image: nginx:1.27-alpine
    container_name: gestaofacil_nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # O Nginx serve os arquivos estáticos de public/ direto do disco,
      # sem passar pelo PHP. Read-only: o proxy nunca escreve no código.
      - ../gestaofacil-api:/var/www/gestaofacil-api:ro
      - ../nfe-api:/var/www/nfe-api:ro
    depends_on:
      - gestaofacil_api
      - nfe_api
      - gestaofacil_fe
    networks:
      gestaofacil_net:
        # Estes aliases fazem os mesmos domínios do navegador funcionarem
        # DENTRO da rede. É o que permite a gestaofacil-api chamar
        # http://nfe.gestaofacil.localhost/api/v1 sem URL especial de
        # container, e o Host bater com o server_name do Nginx.
        aliases:
          # Nomes do NAVEGADOR. Uteis so para quem resolve via /etc/hosts do
          # host; de dentro de um container eles NAO funcionam (ver abaixo).
          - gestaofacil.localhost
          - api.gestaofacil.localhost
          - nfe.gestaofacil.localhost
          # Nomes INTERNOS, para chamada container-a-container.
          # Existem porque a glibc implementa a RFC 6761: todo nome terminado
          # em `.localhost` e forcado para 127.0.0.1 dentro do getaddrinfo,
          # sem nunca consultar o DNS do Docker. Um container que chamasse
          # http://nfe.gestaofacil.localhost bateria no proprio loopback e
          # levaria "Connection refused". Por isso o dominio interno e outro.
          - api.gestaofacil.internal
          - nfe.gestaofacil.internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  #  FRONTEND — Vite dev server com HMR
  # ─────────────────────────────────────────────────────────────────────────
  gestaofacil_fe:
    build:
      context: ../gestaofacil-fe
      # Stage 'dev': só instala dependências, não roda build de produção.
      target: dev
    container_name: gestaofacil_fe
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ../gestaofacil-fe:/app
      # Volume anônimo: preserva o node_modules instalado na imagem (Linux)
      # em vez de deixá-lo ser encoberto pelo node_modules do host.
      - /app/node_modules
    environment:
      # O browser resolve esta URL, não o container — por isso é o domínio
      # público, não o nome do serviço.
      # Quem resolve estas URLs e o NAVEGADOR, entao levam a porta publicada.
      # Com HTTP_PORT=80 o ":80" e inofensivo; com 8080 e obrigatorio.
      VITE_API_URL: http://api.gestaofacil.localhost:${HTTP_PORT:-80}
      VITE_NFE_API_URL: http://nfe.gestaofacil.localhost:${HTTP_PORT:-80}
      # Vite precisa disso para HMR funcionar atrás de volume montado.
      CHOKIDAR_USEPOLLING: "true"
    expose:
      - "3000"
    networks:
      - gestaofacil_net

  # ─────────────────────────────────────────────────────────────────────────
  #  API PRINCIPAL DE GESTÃO (Laravel / PHP-FPM)
  # ─────────────────────────────────────────────────────────────────────────
  gestaofacil_api:
    build:
      context: ../gestaofacil-api
      dockerfile: docker/Dockerfile.dev
    container_name: gestaofacil_api
    working_dir: /var/www/gestaofacil-api
    volumes:
      - ../gestaofacil-api:/var/www/gestaofacil-api
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://api.gestaofacil.localhost
      DB_CONNECTION: pgsql
      DB_HOST: gestaofacil_db
      DB_PORT: 5432
      DB_DATABASE: ${GESTAOFACIL_DB_DATABASE:-gestaofacil}
      DB_USERNAME: ${GESTAOFACIL_DB_USERNAME:-gestaofacil}
      DB_PASSWORD: ${GESTAOFACIL_DB_PASSWORD:-secret}
      REDIS_HOST: gestaofacil_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      # Origens que podem chamar a API do navegador (sem a porta na 80; com a porta do nginx).
      CORS_ALLOWED_ORIGINS: "http://gestaofacil.localhost,http://gestaofacil.localhost:${HTTP_PORT:-80}"
      # Redis é compartilhado: cada app usa um database numerado diferente
      # para não haver colisão de chave entre os dois sistemas.
      REDIS_DB: "0"
      REDIS_CACHE_DB: "2"
      # Chamada interna à NFe-API. Resolve pelo alias de rede do Nginx.
      # Dominio .internal (nao .localhost) — ver comentario nos aliases do proxy.
      # Sem porta: dentro da rede o nginx escuta na 80, independente de HTTP_PORT.
      # O controller adiciona /v1 automaticamente, então aqui passamos só /api
      API_NFE_URL: http://nfe.gestaofacil.internal/api
      # Cadastro de empresa pelo dono da plataforma (PLAN-ADMIN-SISTEMA.md). Desligado por padrão: a
      # rota responde 404. Para usar, defina no .env deste diretório e rode `make cache-clear`:
      #   PLATAFORMA_CADASTRO_HABILITADO=true
      #   PLATAFORMA_CHAVE_HASH=<php -r "echo hash('sha256','SUA-CHAVE');">
      #   NFE_API_PROVISIONAMENTO_CHAVE=<chave entre servidores; o nfe-api guarda o SHA-256 dela>
      PLATAFORMA_CADASTRO_HABILITADO: ${PLATAFORMA_CADASTRO_HABILITADO:-false}
      PLATAFORMA_CHAVE_HASH: ${PLATAFORMA_CHAVE_HASH:-}
      NFE_API_PROVISIONAMENTO_CHAVE: ${NFE_API_PROVISIONAMENTO_CHAVE:-}
    depends_on:
      gestaofacil_db:
        condition: service_healthy
      gestaofacil_redis:
        condition: service_healthy
    networks:
      - gestaofacil_net

  # Agendador do Laravel: roda `nfe:reconciliar-pendentes` a cada 5 minutos (routes/console.php).
  # Sem ele, nota pendente (webhook perdido, timeout no envio) só se resolve se alguém abrir a tela.
  gestaofacil_scheduler:
    extends:
      service: gestaofacil_api
    container_name: gestaofacil_scheduler
    command: php artisan schedule:work
    restart: unless-stopped

  gestaofacil_db:
    image: postgres:16-alpine
    container_name: gestaofacil_db
    environment:
      POSTGRES_DB: ${GESTAOFACIL_DB_DATABASE:-gestaofacil}
      POSTGRES_USER: ${GESTAOFACIL_DB_USERNAME:-gestaofacil}
      POSTGRES_PASSWORD: ${GESTAOFACIL_DB_PASSWORD:-secret}
    ports:
      # ATENÇÃO: 5432 é a porta padrão do Postgres instalado no host.
      # Se você tem Postgres nativo rodando, troque GESTAOFACIL_DB_PORT
      # no .env (ex: 5442). Rode `make doctor` para detectar o conflito.
      - "${GESTAOFACIL_DB_PORT:-5432}:5432"
    volumes:
      - gestaofacil_pgdata:/var/lib/postgresql/data
    networks:
      - gestaofacil_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GESTAOFACIL_DB_USERNAME:-gestaofacil}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  #  API DE EMISSÃO DE NFe (Laravel / PHP-FPM) + worker
  # ─────────────────────────────────────────────────────────────────────────
  nfe_api:
    build:
      context: ../nfe-api
      dockerfile: docker/php/Dockerfile
    container_name: nfe_api
    working_dir: /var/www/nfe-api
    volumes:
      - ../nfe-api:/var/www/nfe-api
    environment: &nfe_env
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://nfe.gestaofacil.localhost
      DB_CONNECTION: pgsql
      DB_HOST: nfe_db
      DB_PORT: 5432
      DB_DATABASE: ${NFE_DB_DATABASE:-nfe_api}
      DB_USERNAME: ${NFE_DB_USERNAME:-nfe_api}
      DB_PASSWORD: ${NFE_DB_PASSWORD:-secret}
      REDIS_HOST: gestaofacil_redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-secret}
      REDIS_DB: "1"
      REDIS_CACHE_DB: "3"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      # Chave dedicada para criptografar certificados A1. NUNCA igual à APP_KEY.
      NFE_CERT_ENCRYPTION_KEY: ${NFE_CERT_ENCRYPTION_KEY:-}
      # 2 = homologação. O gateway 'fake' NÃO fala com a SEFAZ: nada emitido
      # aqui tem validade fiscal. Trocar exige certificado real configurado.
      SEFAZ_ENVIRONMENT: "2"
      NFE_SEFAZ_GATEWAY: ${NFE_SEFAZ_GATEWAY:-fake}
      # Busca de notas na SEFAZ (NFeDistribuicaoDFe): trava de segurança. Com o gateway `real`, só consulta de verdade se for `true`
      # (gasta a cota do CNPJ). Em produção (APP_ENV=production) o padrão da aplicação já é ligado.
      NFE_DFE_REAL_HABILITADO: ${NFE_DFE_REAL_HABILITADO:-false}
      # Grupo infRespTec. Sem CNPJ a tag não é gerada e PE rejeita com 972.
      NFE_RESP_TEC_CNPJ: ${NFE_RESP_TEC_CNPJ:-}
      NFE_RESP_TEC_CONTATO: ${NFE_RESP_TEC_CONTATO:-}
      NFE_RESP_TEC_EMAIL: ${NFE_RESP_TEC_EMAIL:-}
      NFE_RESP_TEC_FONE: ${NFE_RESP_TEC_FONE:-}
      # SHA-256 da chave que o gestaofacil envia para cadastrar empresas. Vazio = provisionamento recusado.
      PROVISIONAMENTO_CHAVE_HASH: ${PROVISIONAMENTO_CHAVE_HASH:-}
    depends_on:
      nfe_db:
        condition: service_healthy
      gestaofacil_redis:
        condition: service_healthy
    networks:
      - gestaofacil_net

  nfe_worker:
    build:
      context: ../nfe-api
      dockerfile: docker/php/Dockerfile
    container_name: nfe_worker
    working_dir: /var/www/nfe-api
    # Horizon está instalado (laravel/horizon ^5.24) e é o supervisor das
    # filas. Se um dia sair do composer.json, troque por:
    #   php artisan queue:work redis --tries=3 --timeout=90
    command: php artisan horizon
    # Mesmo usuário do php-fpm do nfe_api (a imagem php:8.3-fpm roda os filhos
    # como www-data). Os dois containers compartilham o bind mount de storage/:
    # com o Horizon como root, os XMLs e DANFEs nasciam root:root em diretório
    # 0700 (padrão "private" do Flysystem) e o nfe_api respondia
    # "XML nao encontrado no armazenamento" para arquivos que existiam.
    user: www-data
    volumes:
      - ../nfe-api:/var/www/nfe-api
    environment: *nfe_env
    depends_on:
      nfe_db:
        condition: service_healthy
      gestaofacil_redis:
        condition: service_healthy
    networks:
      - gestaofacil_net
    restart: unless-stopped

  nfe_db:
    image: postgres:16-alpine
    container_name: nfe_db
    environment:
      POSTGRES_DB: ${NFE_DB_DATABASE:-nfe_api}
      POSTGRES_USER: ${NFE_DB_USERNAME:-nfe_api}
      POSTGRES_PASSWORD: ${NFE_DB_PASSWORD:-secret}
    ports:
      - "${NFE_DB_PORT:-5433}:5432"
    volumes:
      - nfe_pgdata:/var/lib/postgresql/data
    networks:
      - gestaofacil_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NFE_DB_USERNAME:-nfe_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────
  #  REDIS COMPARTILHADO (cache + filas dos dois backends)
  # ─────────────────────────────────────────────────────────────────────────
  gestaofacil_redis:
    image: redis:7-alpine
    container_name: gestaofacil_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-secret}
    # redis-cli lê REDISCLI_AUTH: o healthcheck e o `make redis-cli` continuam funcionando
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - gestaofacil_redisdata:/data
    networks:
      - gestaofacil_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gestaofacil_pgdata:
  nfe_pgdata:
  gestaofacil_redisdata:

networks:
  gestaofacil_net:
    driver: bridge
    name: gestaofacil_net
